name: listen_it
description: ValueListenable operators (map, where, select, debounce, combineLatest) and reactive collections (ListNotifier, MapNotifier, SetNotifier). Formerly known as functional_listener.
version: 5.3.5
maintainer: Thomas Burkhart (@escamoteur)
homepage: https://github.com/flutter-it/listen_it
repository: https://github.com/flutter-it/listen_it
funding:
  - https://github.com/sponsors/escamoteur/

screenshots:
  - description: 'The listen_it logo'
    path: listen_it.png

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  collection: ^1.17.2
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker:
  lint: ^2.14.0
  watch_it: ^2.0.0
